<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Image Slider Modificado</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    /* Estilos base y reset */
    body { margin: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #222; }
    h3, h4 { margin: 0; }

    .wrapper {
      max-width: 60em;
      margin: 2em auto;
      position: relative;
    }

    input[type="radio"] {
      display: none;
    }

    /* Estructura interna del slider */
    .inner {
      width: 500%; /* 5 slides * 100% */
      line-height: 0;
      display: flex; /* Usamos flex para alinear mejor */
    }

    article {
      width: 20%; /* 100% / 5 slides */
      position: relative;
      float: left; /* Mantenido para compatibilidad con el diseño original */
    }

    article img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* --- CAJA DE INFORMACIÓN (MODIFICADO) --- */
    .info {
      position: absolute;
      /* Posición FIJA en la esquina inferior izquierda */
      bottom: 40px;
      left: 40px;
      text-align: left;
      color: #fff;
      /* Sombra fuerte para asegurar legibilidad sobre cualquier imagen */
      text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
      z-index: 10;
      /* Ya no hay opacidad inicial ni transición de retardo */
    }

    /* Título más grande */
    .info h3 {
      color: #fff;
      font-weight: 700;
      font-size: 3.5em; /* Mucho más grande */
      line-height: 1.1;
      margin-bottom: 5px;
    }

    /* Nuevo estilo para el Subtítulo */
    .info h4 {
        color: #ddd; /* Un blanco ligeramente apagado */
        font-size: 1.3em;
        font-weight: 400;
        letter-spacing: 1px;
    }


    /* --- CONTROLES DEL SLIDER --- */
    
    /* Controles Prev/Next (Flechas laterales) */
    .slider-prev-next-control {
      height: 50px;
      position: absolute;
      top: 50%;
      width: 100%;
      transform: translateY(-50%);
      z-index: 20;
    }

    .slider-prev-next-control label {
      display: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.8);
      cursor: pointer;
      transition: all 0.3s;
    }

    .slider-prev-next-control label:hover {
      background: rgba(255,255,255,1);
    }

    /* Controles de Puntos (Dots inferiores) */
    .slider-dot-control {
      position: absolute;
      width: 100%;
      bottom: 15px;
      text-align: center;
      z-index: 20;
    }

    .slider-dot-control label {
      cursor: pointer;
      border-radius: 5px;
      display: inline-block;
      width: 10px;
      height: 10px;
      background: rgba(255,255,255,0.4);
      transition: all 0.3s;
      margin: 0 4px;
    }

    .slider-dot-control label:hover {
      background: rgba(255,255,255,0.8);
    }

    /* Contenedor principal y máscara */
    .slider-wrapper {
      width: 100%;
      overflow: hidden;
      border-radius: 8px; /* Bordes un poco más redondeados */
      box-shadow: 0px 10px 20px rgba(0,0,0,0.5);
      background: #000;
      transform: translateZ(0);
    }

    .slider-wrapper .inner {
      transform: translateZ(0);
      /* Transición suave del deslizamiento */
      transition: all 800ms cubic-bezier(0.77, 0, 0.175, 1);
    }


    /* --- LÓGICA DE FUNCIONAMIENTO (CSS Puro) --- */

    /* 1. Movimiento del slider según el radio button activo */
    #slide1:checked ~ .slider-wrapper .inner { margin-left: 0%; }
    #slide2:checked ~ .slider-wrapper .inner { margin-left: -100%; }
    #slide3:checked ~ .slider-wrapper .inner { margin-left: -200%; }
    #slide4:checked ~ .slider-wrapper .inner { margin-left: -300%; }
    #slide5:checked ~ .slider-wrapper .inner { margin-left: -400%; }

    /* 2. Resaltar el punto (dot) activo */
    #slide1:checked ~ .slider-dot-control label:nth-child(1),
    #slide2:checked ~ .slider-dot-control label:nth-child(2),
    #slide3:checked ~ .slider-dot-control label:nth-child(3),
    #slide4:checked ~ .slider-dot-control label:nth-child(4),
    #slide5:checked ~ .slider-dot-control label:nth-child(5) {
      background: #fff;
    }

    /* (NOTA: Se eliminó la lógica que hacía aparecer/desaparecer el texto .info, ahora es siempre visible) */

    /* 3. Lógica de Flechas "Siguiente" */
    #slide1:checked ~ .slider-prev-next-control label:nth-child(2),
    #slide2:checked ~ .slider-prev-next-control label:nth-child(3),
    #slide3:checked ~ .slider-prev-next-control label:nth-child(4),
    #slide4:checked ~ .slider-prev-next-control label:nth-child(5),
    #slide5:checked ~ .slider-prev-next-control label:nth-child(1) {
      display: block;
      float: right;
      margin-right: 10px;
    }

    /* Ícono flecha derecha (FontAwesome) */
    #slide1:checked ~ .slider-prev-next-control label:nth-child(2)::after,
    #slide2:checked ~ .slider-prev-next-control label:nth-child(3)::after,
    #slide3:checked ~ .slider-prev-next-control label:nth-child(4)::after,
    #slide4:checked ~ .slider-prev-next-control label:nth-child(5)::after,
    #slide5:checked ~ .slider-prev-next-control label:nth-child(1)::after {
      font-family: FontAwesome;
      content: "\f105";
      font-size: 2em;
      color: #555;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      padding-left: 3px; /* Ajuste visual fino */
    }

    /* 4. Lógica de Flechas "Anterior" */
    #slide2:checked ~ .slider-prev-next-control label:nth-child(1),
    #slide3:checked ~ .slider-prev-next-control label:nth-child(2),
    #slide4:checked ~ .slider-prev-next-control label:nth-child(3),
    #slide5:checked ~ .slider-prev-next-control label:nth-child(4),
    #slide1:checked ~ .slider-prev-next-control label:nth-child(5) {
      display: block;
      float: left;
      margin-left: 10px;
    }

    /* Ícono flecha izquierda (FontAwesome) */
    #slide2:checked ~ .slider-prev-next-control label:nth-child(1)::after,
    #slide3:checked ~ .slider-prev-next-control label:nth-child(2)::after,
    #slide4:checked ~ .slider-prev-next-control label:nth-child(3)::after,
    #slide5:checked ~ .slider-prev-next-control label:nth-child(4)::after,
    #slide1:checked ~ .slider-prev-next-control label:nth-child(5)::after {
      font-family: FontAwesome;
      content: "\f104";
      font-size: 2em;
      color: #555;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      padding-right: 3px; /* Ajuste visual fino */
    }


    /* --- RESPONSIVE --- */

    /* Tablet */
    @media only screen and (max-width: 850px) {
      .wrapper {
          margin: 0;
          max-width: 100%;
      }
      .slider-wrapper {
        border-radius: 0;
      }
      /* Reducimos un poco el texto en tablets */
      .info h3 { font-size: 2.5em; }
      .info h4 { font-size: 1.1em; }
      .info { bottom: 30px; left: 30px; }
    }

    /* Móvil */
    @media only screen and (max-width: 450px) {
      /* En móviles muy pequeños, el texto grande puede tapar demasiado la imagen.
         Opcional: descomentar la siguiente línea si prefieres ocultarlo en celulares pequeños */
      /* .slider-wrapper .info { display: none; } */
      
      /* Si se muestra, lo hacemos más pequeño */
       .info h3 { font-size: 1.8em; }
       .info h4 { font-size: 1em; }
       .info { bottom: 20px; left: 20px; }
       
       /* Ocultamos las flechas en móvil para dejar solo los puntos */
       .slider-prev-next-control { display: none; }
    }

  </style>
</head>
<body>

<div class="wrapper">
  <input checked type="radio" name="slider" id="slide1" />
  <input type="radio" name="slider" id="slide2" />
  <input type="radio" name="slider" id="slide3" />
  <input type="radio" name="slider" id="slide4" />
  <input type="radio" name="slider" id="slide5" />

  <div class="slider-wrapper">
    <div class="inner">
      
      <article>
        <div class="info"> <h3>Malacca</h3>
          <h4>Ciudad histórica junto al estrecho</h4> </div>
        <img src="https://farm9.staticflickr.com/8059/28286750501_dcc27b1332_h_d.jpg" alt="Malacca" />
      </article>

      <article>
        <div class="info">
          <h3>Cameron Highland</h3>
          <h4>Plantaciones de té y clima fresco</h4>
        </div>
        <img src="https://farm6.staticflickr.com/5812/23394215774_b76cd33a87_h_d.jpg" alt="Cameron Highland" />
      </article>

      <article>
        <div class="info">
          <h3>New Delhi</h3>
          <h4>Capital vibrante de la India</h4>
        </div>
        <img src="https://farm8.staticflickr.com/7455/27879053992_ef3f41c4a0_h_d.jpg" alt="New Delhi" />
      </article>

      <article>
        <div class="info">
          <h3>Ladakh</h3>
          <h4>Tierra de pasos altos</h4>
        </div>
        <img src="https://farm8.staticflickr.com/7367/27980898905_72d106e501_h_d.jpg" alt="Ladakh" />
      </article>

      <article>
        <div class="info">
          <h3>Nubra Valley</h3>
          <h4>Desierto frío en el Himalaya</h4>
        </div>
        <img src="https://farm8.staticflickr.com/7356/27980899895_9b6c394fec_h_d.jpg" alt="Nubra Valley" />
      </article>

    </div>
    </div>
  <div class="slider-prev-next-control">
    <label for="slide1"></label>
    <label for="slide2"></label>
    <label for="slide3"></label>
    <label for="slide4"></label>
    <label for="slide5"></label>
  </div>

  <div class="slider-dot-control">
    <label for="slide1"></label>
    <label for="slide2"></label>
    <label for="slide3"></label>
    <label for="slide4"></label>
    <label for="slide5"></label>
  </div>
</div>

</body>
</html>
